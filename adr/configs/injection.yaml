# Artifact templates and injection (PROJECT_PLAN.md §9.3 step 6, milestone 6).
fs: 128                 # injection rate (Section A runs at 128 Hz)

# Phantom ground-truth source activity (GT channels are on an arbitrary
# broadcast scale; thresholds read off the waveforms, see notebook 05).
phantom_labels:
  blink_threshold: 0.25       # ch11 above its running median
  saccade_threshold: 0.12     # ch12 |deviation| from its running median
  facial_rms_threshold: 0.08  # RMS of mean |ch17-20| in the window
  baseline_window_s: 1.0      # running-median length for the eye channels

# Brain removal from phantom recordings: regression of the scalp EEG on the
# 10 broadcast brain sources (lags in samples at 512 Hz), fitted on the
# brain-only recording.
phantom_brain_lags: [-2, -1, 0, 1, 2]
phantom_highpass_hz: 0.5

# Template event durations (s): ranges for cutting continuous artifact fields.
durations:
  ocular: [1.0, 3.0]
  muscle: [0.5, 3.0]
  motion: [2.0, 6.0]

# PhysioMotion secondary templates (ablation): isolation filters.
physiomotion:
  muscle_highpass_hz: 20      # plus a broadband version (ablation, §12)
  ocular_lowpass_hz: 10
  motion_lowpass_hz: 5
  min_event_s: 0.3
  max_event_s: 6.0

# Injection
events_per_minute: 4
min_gap_s: 1.0
sar_db: [-10, -5, 0, 5, 10]   # plan §9.3: -10 to +10 dB
sar_reference: all            # 'all'-channel RMS (default) or 'affected' (ablation);
                              # pops always use the affected channel
