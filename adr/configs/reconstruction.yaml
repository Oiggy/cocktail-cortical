# Reconstruction (PROJECT_PLAN.md §8; milestone 7). Every value here is a
# hyperparameter tuned on Section A Set A only (milestone 9), then frozen;
# these are starting values.
mwf:
  delay: 0            # time lags each side (Somers et al. toolbox default 0); lag count ablation §12
  rank: eig>4         # 'poseig' (all eigenvalues > 1), 'eig>T', or an integer; rank ablation §12.
                      # poseig kept 24-33 of 64 components on S4 (chance eigenvalues > 1)
  mu: 1.0             # speech-distortion weighting (1 = plain MWF)
  min_samples: 256    # minimum flagged / clean samples to fit a filter
ridge_frontal:
  reference: [Fp1, Fp2, AF7, AF8]   # EOG stand-ins (plan §8)
  alpha: 1.0e-3       # ridge penalty, relative to the mean reference variance
ocular_method: mwf+ridge   # 'mwf', 'ridge' or 'mwf+ridge'
motion_method: mwf         # 'mwf' or 'interp' (ablation)
spatial_interp:
  n_neighbours: 8     # nearest good channels used to predict a bad one (tuned)
  alpha: 0.1          # ridge penalty, relative to the mean clean variance (1e-3 let
                      # collinear neighbours amplify contamination to hundreds of uV)
  bad_z: 3.0          # channel is contaminated in a window if its robust z exceeds this
  band_muscle: [20, 60]   # Hz, band for the muscle contamination score
  max_bad_fraction: 0.5   # beyond this, the window falls back to MWF
taper_s: 0.25         # raised-cosine blend at corrected-segment edges (0 = off; ablation)
max_modified_fraction: 0.5   # over-cleaning cap (ablation)
