# Comparison methods (PROJECT_PLAN.md §11). Fixed before any test data are touched.
ica_iclabel:
  method: picard             # picard (ortho=False, extended=True) = extended infomax; accepted by ICLabel
  fit_highpass_hz: 1.0
  fit_lowpass_hz: 100.0      # capped just below Nyquist at lower rates (Section A: 63 Hz at 128 Hz)
  max_iter: 1000
  fit_decim: 1               # decimation for the ICA fit only (compute budget; 1 = none)
  reject_labels: [eye blink, muscle artifact, heart beat, line noise, channel noise]
  threshold: 0.7             # plus 0.5 and 0.9 as a sensitivity check (§11.1)
  sensitivity_thresholds: [0.5, 0.9]
mwf_auto:                    # RELAX-style automatic marking + MWF (optional baseline, Bailey et al. 2023)
  window_s: 1.0
  step_s: 0.5
  blink_channels: [Fp1, Fp2, AF7, AF8]
  blink_iqr_k: 3.0           # window marked if frontal peak-to-peak > Q3 + k * IQR
  muscle_slope_band_hz: [7, 60]   # RELAX: 7-75 Hz; capped below Nyquist at 128 Hz
  # FROZEN 2026-10-15 (open item 14, option b): calibrated on Section A Set A to mark
  # 5 % of artifact-free windows (median over the 8 Set A noise subjects of each
  # subject's 95th percentile; adr.baselines.mwf_auto.calibrate_muscle_threshold,
  # scripts/13_calibrate_relax.py). RELAX default -0.59 marked 46-90 % of artifact-free
  # windows at 128 Hz. Set A check (8 subjects): muscle sensitivity 0.77 (SAR -10) / 0.60
  # (SAR 0) at 5.6 % false marks (default: 0.97 / 0.94 at 69 %). Do not change after Set B.
  muscle_slope_threshold: 0.777
  relax_default_muscle_slope_threshold: -0.59
  extreme_iqr_k: 5.0         # window marked if any channel peak-to-peak > Q3 + k * IQR (all channels)
  order: [muscle, blink]     # sequential MWFs, as in RELAX
