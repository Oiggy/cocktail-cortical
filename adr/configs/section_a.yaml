# Section A (semi-synthetic validation on Dataset I v2.0), PROJECT_PLAN.md §9.
# TRFs follow the mTRF convention implemented in adr.trf.ridge.
trf:
  tmin: 0.0         # s; lags 0-400 ms = 14 samples at 32 Hz (Das et al. 2020)
  tmax: 0.4
  lambda_short: 0.2 # short-term TRFs within each 120 s trial (plan §9.4)
  # Long-term TRFs (plan §9.2 step 1): Das et al.'s rule - penalty = max |X'X|
  # (adr.trf.ridge.das_lambda). lambda = 0.2 left the TRF essentially
  # unregularised: weights alternated sign lag to lag (roughness 3.1 vs 1.2)
  # with identical held-out prediction (r 0.0177 vs 0.0178). Milestone 3.
  lambda_long: das
base_channel: C5    # base TRF shape (plan §9.2 step 3)
condition: hrtf     # keep only HRTF trials, repetitions included (plan §9.1)
snr_db: [0, -5, -10, -15, -20, -25]  # plan §9.3 step 4 (verified range 0 to -25 dB)
trial_seconds: 120                   # short-term TRF trials (plan §9.4)
# Native transients in the "clean" (MWF-cleaned) Dataset I base (decided
# 2026-10-15, open item 13 option b): 1 s windows where any channel exceeds
# this peak-to-peak (+ 0.25 s margins) are cut out of the noise before
# synthesis (segments joined with 0.25 s crossfades), and any remaining such
# windows are excluded from Section A scoring. Threshold 500 uV chosen from
# the sensitivity check (scripts/12_native_transients.py): median 1 % cut
# (max 3 %), 18-19 x 120 s trials per condition kept; 200 uV would cut a
# median 33 % (S9: 77 %). null = no cutting, score everything.
native_transient_ptp_uv: 500
