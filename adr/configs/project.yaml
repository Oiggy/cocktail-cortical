# Global settings shared by every script. Hyperparameters that get tuned on
# Section A Set A live in their own config files once those stages exist.
seed: 20261015

# Detector channel set (PROJECT_PLAN.md §6), frozen 2026-10-15: the 57
# PhysioMotion raw channels that also exist in BioSemi 64, in BioSemi order
# (from results/verify/openneuro_verify.json). Features use all 57.
detector_channels: [Fp1, AF7, AF3, F1, F3, F5, F7, FT7, FC5, FC3, FC1, C1, C3,
                    C5, T7, TP7, CP5, CP3, CP1, P3, P5, P7, PO7, PO3, O1, Oz,
                    POz, Pz, Fpz, Fp2, AF8, AF4, Fz, F2, F4, F6, F8, FT8, FC6,
                    FC4, FC2, FCz, Cz, C2, C4, C6, T8, TP8, CP6, CP4, CP2, P4,
                    P6, P8, PO8, PO4, O2]

# PhysioMotion annotations live on a bipolar montage over these 19 10-20
# electrodes (plus channel ALL). Window labels: a window carries a class if
# any annotated pair does during the window (OR); also report >= 2 pairs.
label_electrodes: [Fp1, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8,
                   P7, P3, Pz, P4, P8, O1, O2]

# Fallback if PhysioMotion names do not match BioSemi 64: the 19 standard
# 10-20 channels, with old-style labels renamed if they occur.
fallback_channels: [Fp1, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8,
                    P7, P3, Pz, P4, P8, O1, O2]
