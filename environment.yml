# eelbrain's own in-development BIDS support (its `Pipeline` class) has
# absorbed everything this project needs natively - TRF fitting,
# UTSPredictor, load_model_test, make_bad_channels, make_ica_selection.
# trftools is NOT used or needed: its published `main` branch hasn't
# been updated to match this rewrite (it still imports several eelbrain
# internals that no longer exist), so it can't currently be imported at
# all against this eelbrain version. Verified directly against the
# original author's own reference implementation for this dataset:
# https://github.com/christianbrodbeck/binaural-cocktail/tree/eelbrain-0.43
#
# Why the extra channel: eelbrain's `Pipeline` class only exists in this
# in-development BIDS support, not yet in a stable release. It's only
# published on this "eelbrain_dev" label, not on the regular conda-forge
# channel or PyPI (where the newest version is still 0.41.2, without
# `Pipeline`). This is also why no Python version is pinned below: the
# dev builds require Python 3.12 or 3.13, so letting conda pick avoids
# a conflict.
name: cocktail-cortical
channels:
  - conda-forge
  - conda-forge/label/eelbrain_dev
dependencies:
  - eelbrain>=0.42.0a4
  - pip
  - ipython
  - jupyter
  - ipywidgets
  - jupytext
  - seaborn
  - pip:
      # eelbrain's gammatone_bank() needs this at runtime; it's an
      # optional dependency eelbrain doesn't install for you, and it
      # isn't on conda-forge either.
      - gammatone
